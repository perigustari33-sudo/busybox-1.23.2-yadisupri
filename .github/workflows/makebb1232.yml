name: Build BusyBox Static for MDM9607 (GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup GCC 4.9 from Ubuntu repositories
      run: |
        # Tambahkan repository untuk GCC 4.9
        sudo apt-get update
        sudo apt-get install -y gcc-4.9-arm-linux-gnueabihf g++-4.9-arm-linux-gnueabihf
        
        # Set sebagai default
        sudo update-alternatives --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-4.9 100
        sudo update-alternatives --set arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc-4.9
        
        # Verifikasi
        arm-linux-gnueabihf-gcc --version

    - name: Install dependencies
      run: |
        sudo apt-get install -y make qemu-user-static binutils-arm-linux-gnueabihf

    - name: Configure and build
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        make defconfig
        echo "CONFIG_STATIC=y" >> .config
        echo "# CONFIG_FEATURE_SHARED_BUSYBOX is not set" >> .config
        sed -i 's/^CONFIG_SHA1_HWACCEL=y/# CONFIG_SHA1_HWACCEL is not set/' .config
        sed -i 's/^CONFIG_SHA256_HWACCEL=y/# CONFIG_SHA256_HWACCEL is not set/' .config
        make oldconfig
        
        make -j$(nproc) \
             CFLAGS="-Os -pipe -static -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard" \
             LDFLAGS="-static" \
             SKIP_STRIP=n

    - name: Test binary
      run: |
        qemu-arm-static ./busybox --version

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-mdm9607-gcc49
        path: busybox
