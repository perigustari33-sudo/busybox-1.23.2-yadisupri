name: Build BusyBox with GCC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Cross Compiler and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make \
          bc \
          bison \
          flex \
          cpio \
          libtirpc-dev \
          rpcsvc-proto
        
        # Verify compiler
        arm-linux-gnueabihf-gcc --version

    - name: Build BusyBox with config
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Copy your config
        cp configs/k02a.config .config
        echo "CONFIG_STATIC=y" >> .config
        
        # Disable Werror and RPC if causing issues
        echo "CFLAGS += -Wno-error -Wno-unused-result" >> .config
        
        make oldconfig
        
        # Build with additional include paths for RPC
        make -j$(nproc) \
          CFLAGS="-Wno-error -Wno-unused-result -I/usr/include/tirpc" \
          LDFLAGS="-ltirpc"

    - name: Verify build
      run: |
        file busybox
        ls -lh busybox

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
