name: Build BusyBox Custom Applets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Docker Ubuntu 18.04
      run: |
        docker run --rm -v $(pwd):/build ubuntu:18.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            make bc bison flex cpio && \
          cd /build && \
          export CROSS_COMPILE=arm-linux-gnueabihf- && \
          export ARCH=arm && \
          \
          # Start from empty config
          make allnoconfig && \
          \
          # Base config
          cat > base.config << 'EOF'
          CONFIG_STATIC=y
          CONFIG_CROSS_COMPILER_PREFIX=\"arm-linux-gnueabihf-\"
          CONFIG_FEATURE_BUFFERS_USE_MALLOC=y
          CONFIG_SHOW_USAGE=y
          CONFIG_FEATURE_VERBOSE_USAGE=y
          CONFIG_LONG_OPTS=y
          CONFIG_FEATURE_DEVPTS=y
          CONFIG_FEATURE_CLEAN_UP=y
          CONFIG_FEATURE_SUID=y
          CONFIG_FEATURE_PREFER_APPLETS=y
          CONFIG_BUSYBOX_EXEC_PATH=\"/proc/self/exe\"
          CONFIG_FEATURE_SYSLOG=y
          CONFIG_INSTALL_APPLET_SYMLINKS=y
          CONFIG_PREFIX=\"./_install\"
          CONFIG_FEATURE_EDITING=y
          CONFIG_FEATURE_EDITING_VI=y
          CONFIG_FEATURE_EDITING_HISTORY=255
          CONFIG_FEATURE_TAB_COMPLETION=y
          CONFIG_LFS=y
          EOF
          \
          cat base.config >> .config && \
          \
          # Aktifkan applets yang diinginkan (semua dari daftar Anda)
          cat >> .config << 'EOF'
          # Coreutils
          CONFIG_YES=y
          CONFIG_TRUE=y
          CONFIG_FALSE=y
          CONFIG_TEST=y
          CONFIG_ECHO=y
          CONFIG_FEATURE_FANCY_ECHO=y
          CONFIG_CAT=y
          CONFIG_LS=y
          CONFIG_FEATURE_LS_FILETYPES=y
          CONFIG_FEATURE_LS_RECURSIVE=y
          CONFIG_FEATURE_LS_SORTFILES=y
          CONFIG_FEATURE_LS_TIMESTAMPS=y
          CONFIG_FEATURE_LS_USERNAME=y
          CONFIG_FEATURE_LS_COLOR=y
          CONFIG_PWD=y
          CONFIG_RM=y
          CONFIG_MKDIR=y
          CONFIG_CP=y
          CONFIG_MV=y
          CONFIG_LN=y
          CONFIG_RMDIR=y
          CONFIG_TOUCH=y
          CONFIG_BASENAME=y
          CONFIG_DIRNAME=y
          CONFIG_HEAD=y
          CONFIG_TAIL=y
          CONFIG_FEATURE_FANCY_TAIL=y
          CONFIG_SLEEP=y
          CONFIG_FEATURE_FANCY_SLEEP=y
          CONFIG_SYNC=y
          CONFIG_DATE=y
          CONFIG_FEATURE_DATE_ISOFMT=y
          CONFIG_DD=y
          CONFIG_DF=y
          CONFIG_FEATURE_DF_FANCY=y
          CONFIG_DU=y
          CONFIG_FEATURE_DU_DEFAULT_BLOCKSIZE_1K=y
          CONFIG_PRINTF=y
          CONFIG_SORT=y
          CONFIG_FEATURE_SORT_BIG=y
          CONFIG_UNIQ=y
          CONFIG_WC=y
          CONFIG_FEATURE_WC_LARGE=y
          CONFIG_WHOAMI=y
          CONFIG_ID=y
          CONFIG_GROUPS=y
          CONFIG_UNAME=y
          CONFIG_HOSTNAME=y
          CONFIG_DNSDOMAINNAME=y
          CONFIG_WHO=y
          CONFIG_USERS=y
          CONFIG_LOGNAME=y
          
          # Shell
          CONFIG_ASH=y
          CONFIG_ASH_BASH_COMPAT=y
          CONFIG_ASH_JOB_CONTROL=y
          CONFIG_ASH_ALIAS=y
          CONFIG_ASH_GETOPTS=y
          CONFIG_ASH_BUILTIN_ECHO=y
          CONFIG_ASH_BUILTIN_PRINTF=y
          CONFIG_ASH_BUILTIN_TEST=y
          CONFIG_ASH_CMDCMD=y
          CONFIG_ASH_OPTIMIZE_FOR_SIZE=y
          CONFIG_HUSH=y
          CONFIG_HUSH_BASH_COMPAT=y
          CONFIG_HUSH_BRACE_EXPANSION=y
          CONFIG_HUSH_HELP=y
          CONFIG_HUSH_INTERACTIVE=y
          CONFIG_HUSH_JOB=y
          CONFIG_HUSH_TICK=y
          CONFIG_HUSH_IF=y
          CONFIG_HUSH_LOOPS=y
          CONFIG_HUSH_CASE=y
          CONFIG_HUSH_FUNCTIONS=y
          CONFIG_SH_MATH_SUPPORT=y
          CONFIG_SH_MATH_SUPPORT_64=y
          
          # System Utilities
          CONFIG_DMESG=y
          CONFIG_FEATURE_DMESG_PRETTY=y
          CONFIG_MORE=y
          CONFIG_KILL=y
          CONFIG_KILLALL=y
          CONFIG_KILLALL5=y
          CONFIG_PS=y
          CONFIG_FEATURE_PS_WIDE=y
          CONFIG_FEATURE_PS_TIME=y
          CONFIG_FEATURE_PS_ADDITIONAL_COLUMNS=y
          CONFIG_TOP=y
          CONFIG_FEATURE_TOP_CPU_USAGE_PERCENTAGE=y
          CONFIG_FEATURE_TOP_DECIMALS=y
          CONFIG_FEATURE_TOP_SMP_PROCESS=y
          CONFIG_FEATURE_TOPMEM=y
          CONFIG_UPTIME=y
          CONFIG_FREE=y
          CONFIG_FDISK=y
          CONFIG_FDISK_SUPPORT_LARGE_DISKS=y
          CONFIG_FEATURE_FDISK_WRITABLE=y
          CONFIG_MOUNT=y
          CONFIG_UMOUNT=y
          CONFIG_FEATURE_MOUNT_FAKE=y
          CONFIG_FEATURE_MOUNT_VERBOSE=y
          CONFIG_FEATURE_MOUNT_HELPERS=y
          CONFIG_FEATURE_MOUNT_LABEL=y
          CONFIG_FEATURE_MOUNT_NFS=y
          CONFIG_FEATURE_MOUNT_CIFS=y
          CONFIG_FEATURE_MTAB_SUPPORT=y
          CONFIG_SWAPON=y
          CONFIG_SWAPOFF=y
          CONFIG_FEATURE_SWAPON_PRI=y
          CONFIG_MKSWAP=y
          CONFIG_LOSETUP=y
          CONFIG_BLKID=y
          CONFIG_BLOCKDEV=y
          
          # Networking
          CONFIG_PING=y
          CONFIG_PING6=y
          CONFIG_FEATURE_FANCY_PING=y
          CONFIG_WGET=y
          CONFIG_FEATURE_WGET_STATUSBAR=y
          CONFIG_FEATURE_WGET_AUTHENTICATION=y
          CONFIG_FEATURE_WGET_TIMEOUT=y
          CONFIG_FEATURE_WGET_HTTPS=y
          CONFIG_IFCONFIG=y
          CONFIG_FEATURE_IFCONFIG_STATUS=y
          CONFIG_FEATURE_IFCONFIG_HW=y
          CONFIG_FEATURE_IFCONFIG_BROADCAST_PLUS=y
          CONFIG_ROUTE=y
          CONFIG_NETSTAT=y
          CONFIG_FEATURE_NETSTAT_WIDE=y
          CONFIG_FEATURE_NETSTAT_PRG=y
          CONFIG_NSLOOKUP=y
          CONFIG_ARP=y
          CONFIG_ARPING=y
          CONFIG_TRACEROUTE=y
          CONFIG_TRACEROUTE6=y
          CONFIG_FEATURE_TRACEROUTE_VERBOSE=y
          CONFIG_TELNET=y
          CONFIG_TELNETD=y
          CONFIG_FEATURE_TELNETD_STANDALONE=y
          CONFIG_TFTP=y
          CONFIG_TFTPD=y
          CONFIG_FEATURE_TFTP_GET=y
          CONFIG_FEATURE_TFTP_PUT=y
          CONFIG_NC=y
          CONFIG_NC_SERVER=y
          CONFIG_NC_EXTRA=y
          CONFIG_UDHCPC=y
          CONFIG_UDHCPD=y
          CONFIG_FEATURE_UDHCPC_ARPING=y
          CONFIG_FEATURE_UDHCP_RFC3397=y
          CONFIG_IFUPDOWN=y
          CONFIG_FEATURE_IFUPDOWN_IP=y
          CONFIG_FEATURE_IFUPDOWN_IP_BUILTIN=y
          CONFIG_FEATURE_IFUPDOWN_MAPPING=y
          
          # Init
          CONFIG_INIT=y
          CONFIG_FEATURE_USE_INITTAB=y
          CONFIG_FEATURE_INIT_SCTTY=y
          CONFIG_FEATURE_INIT_SYSLOG=y
          CONFIG_FEATURE_INIT_COREDUMPS=y
          CONFIG_HALT=y
          CONFIG_REBOOT=y
          CONFIG_POWEROFF=y
          CONFIG_SWITCH_ROOT=y
          CONFIG_PIVOT_ROOT=y
          
          # Archival
          CONFIG_GUNZIP=y
          CONFIG_GZIP=y
          CONFIG_FEATURE_GZIP_LONG_OPTIONS=y
          CONFIG_TAR=y
          CONFIG_FEATURE_TAR_CREATE=y
          CONFIG_FEATURE_TAR_AUTODETECT=y
          CONFIG_FEATURE_TAR_FROM=y
          CONFIG_FEATURE_TAR_GNU_EXTENSIONS=y
          CONFIG_UNZIP=y
          CONFIG_BUNZIP2=y
          CONFIG_BZIP2=y
          CONFIG_CPIO=y
          CONFIG_FEATURE_CPIO_O=y
          CONFIG_FEATURE_CPIO_P=y
          CONFIG_DPKG=y
          CONFIG_DPKG_DEB=y
          CONFIG_RPM=y
          CONFIG_RPM2CPIO=y
          CONFIG_XZ=y
          CONFIG_UNXZ=y
          CONFIG_LZMA=y
          CONFIG_UNLZMA=y
          CONFIG_LZOP=y
          CONFIG_LZOP_COMPR_HIGH=y
          CONFIG_UNLZOP=y
          
          # Editors
          CONFIG_VI=y
          CONFIG_FEATURE_VI_MAX_LEN=1024
          CONFIG_FEATURE_VI_COLON=y
          CONFIG_FEATURE_VI_YANKMARK=y
          CONFIG_FEATURE_VI_SEARCH=y
          CONFIG_FEATURE_VI_USE_SIGNALS=y
          CONFIG_FEATURE_VI_DOT_CMD=y
          CONFIG_FEATURE_VI_READONLY=y
          CONFIG_FEATURE_VI_SETOPTS=y
          CONFIG_FEATURE_VI_SET=y
          CONFIG_FEATURE_VI_WIN_RESIZE=y
          CONFIG_SED=y
          CONFIG_AWK=y
          CONFIG_FEATURE_AWK_LIBM=y
          CONFIG_ED=y
          CONFIG_PATCH=y
          CONFIG_DIFF=y
          CONFIG_FEATURE_DIFF_LONG_OPTIONS=y
          CONFIG_FEATURE_DIFF_DIR=y
          CONFIG_CMP=y
          CONFIG_COMM=y
          
          # Login
          CONFIG_GETTY=y
          CONFIG_LOGIN=y
          CONFIG_PASSWD=y
          CONFIG_FEATURE_PASSWD_WEAK_CHECK=y
          CONFIG_SU=y
          CONFIG_FEATURE_SU_SYSLOG=y
          CONFIG_SULOGIN=y
          CONFIG_ADDUSER=y
          CONFIG_ADDGROUP=y
          CONFIG_DELUSER=y
          CONFIG_DELGROUP=y
          CONFIG_FEATURE_SHADOWPASSWDS=y
          CONFIG_USE_BB_PWD_GRP=y
          CONFIG_USE_BB_SHADOW=y
          CONFIG_USE_BB_CRYPT=y
          CONFIG_USE_BB_CRYPT_SHA=y
          
          # Process Utilities
          CONFIG_PIDOF=y
          CONFIG_FEATURE_PIDOF_SINGLE=y
          CONFIG_FEATURE_PIDOF_OMIT=y
          CONFIG_PGREP=y
          CONFIG_PKILL=y
          CONFIG_RENICE=y
          CONFIG_PMAP=y
          CONFIG_PSTREE=y
          CONFIG_IOSTAT=y
          CONFIG_MPSTAT=y
          CONFIG_NMETER=y
          CONFIG_POWERTOP=y
          CONFIG_SMEMCAP=y
          CONFIG_WATCH=y
          
          # Other Utilities
          CONFIG_WHICH=y
          CONFIG_XARGS=y
          CONFIG_FEATURE_XARGS_SUPPORT_CONFIRMATION=y
          CONFIG_FEATURE_XARGS_SUPPORT_QUOTES=y
          CONFIG_FEATURE_XARGS_SUPPORT_TERMOPT=y
          CONFIG_FEATURE_XARGS_SUPPORT_ZERO_TERM=y
          CONFIG_GETOPT=y
          CONFIG_FEATURE_GETOPT_LONG=y
          CONFIG_TIMEOUT=y
          CONFIG_WATCHDOG=y
          CONFIG_CROND=y
          CONFIG_CRONTAB=y
          CONFIG_SYSCTL=y
          CONFIG_STRINGS=y
          CONFIG_READLINK=y
          CONFIG_FEATURE_READLINK_FOLLOW=y
          CONFIG_REALPATH=y
          CONFIG_MKTEMP=y
          CONFIG_PIPE_PROGRESS=y
          CONFIG_RUN_PARTS=y
          CONFIG_FEATURE_RUN_PARTS_FANCY=y
          CONFIG_START_STOP_DAEMON=y
          CONFIG_FEATURE_START_STOP_DAEMON_FANCY=y
          CONFIG_CTTYHACK=y
          CONFIG_CHRT=y
          CONFIG_SETARCH=y
          CONFIG_LINUX32=y
          CONFIG_LINUX64=y
          CONFIG_HWCLOCK=y
          CONFIG_SETLOGCONS=y
          CONFIG_DUMPKMAP=y
          CONFIG_LOADKMAP=y
          CONFIG_FGCONSOLE=y
          CONFIG_CLEAR=y
          CONFIG_RESET=y
          CONFIG_RESIZE=y
          CONFIG_FEATURE_RESIZE_PRINT=y
          CONFIG_DEALLOCVT=y
          CONFIG_OPENVT=y
          CONFIG_CHVT=y
          CONFIG_KBD_MODE=y
          CONFIG_SETFONT=y
          CONFIG_LOADFONT=y
          CONFIG_SETKEYCODES=y
          CONFIG_SHOWKEY=y
          CONFIG_MAKEDEVS=y
          CONFIG_FEATURE_MAKEDEVS_TABLE=y
          
          # Console
          CONFIG_FBSET=y
          CONFIG_FEATURE_FBSET_FANCY=y
          CONFIG_FEATURE_FBSET_READMODE=y
          CONFIG_FBSPLASH=y
          
          # Misc
          CONFIG_CAL=y
          CONFIG_NC_SERVER=y
          CONFIG_SETSERIAL=y
          CONFIG_READAHEAD=y
          CONFIG_RFKILL=y
          CONFIG_RTCWAKE=y
          CONFIG_VOLNAME=y
          CONFIG_BEEP=y
          CONFIG_FEATURE_BEEP_FREQ=4000
          CONFIG_FEATURE_BEEP_LENGTH_MS=30
          CONFIG_CHAT=y
          CONFIG_FEATURE_CHAT_NOFAIL=y
          CONFIG_FEATURE_CHAT_SEND_ESCAPES=y
          CONFIG_FEATURE_CHAT_VAR_ABORT_LEN=y
          CONFIG_DEVMEM=y
          CONFIG_EJECT=y
          CONFIG_FLASHCP=y
          CONFIG_FLASH_LOCK=y
          CONFIG_FLASH_UNLOCK=y
          CONFIG_FLASH_ERASEALL=y
          CONFIG_IONICE=y
          CONFIG_INOTIFYD=y
          CONFIG_LAST=y
          CONFIG_FEATURE_LAST_SMALL=y
          CONFIG_FEATURE_LAST_FANCY=y
          CONFIG_RAIDAUTORUN=y
          CONFIG_RX=y
          CONFIG_SETSID=y
          CONFIG_TTYSIZE=y
          
          # Mail
          CONFIG_MAKEMIME=y
          CONFIG_FEATURE_MIME_CHARSET=\"us-ascii\"
          CONFIG_POPMAILDIR=y
          CONFIG_FEATURE_POPMAILDIR_DELIVERY=y
          CONFIG_REFORMIME=y
          CONFIG_FEATURE_REFORMIME_COMPAT=y
          CONFIG_SENDMAIL=y
          
          # Logging
          CONFIG_SYSLOGD=y
          CONFIG_FEATURE_ROTATE_LOGFILE=y
          CONFIG_FEATURE_REMOTE_LOG=y
          CONFIG_FEATURE_SYSLOGD_DUP=y
          CONFIG_FEATURE_SYSLOGD_CFG=y
          CONFIG_KLOGD=y
          CONFIG_FEATURE_KLOGD_KLOGCTL=y
          CONFIG_LOGGER=y
          CONFIG_LOGREAD=y
          EOF
          \
          # Update config
          make oldconfig && \
          \
          # Build
          make -j\$(nproc) CFLAGS=\"-Os -pipe -static -Wno-format-security -Wno-unused-result -Wno-implicit-function-declaration\" LDFLAGS=\"-static\" SKIP_STRIP=n && \
          \
          # Strip
          arm-linux-gnueabihf-strip -s busybox && \
          ls -lh busybox
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-full
        path: busybox
        retention-days: 30
