name: Build BusyBox with GCC 10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC 10
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-10-arm-linux-gnueabihf \
          g++-10-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make bc bison flex cpio
        
        # Verify installation
        which arm-linux-gnueabihf-gcc-10
        arm-linux-gnueabihf-gcc-10 --version

    - name: Build BusyBox
      run: |
        # Set cross compilation variables
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Use your config
        cp configs/k02a.config .config
        echo "CONFIG_STATIC=y" >> .config
        
        # Make oldconfig
        make oldconfig
        
        # Build - CROSS_COMPILE akan otomatis digunakan
        make -j$(nproc)

    - name: Verify build
      run: |
        file busybox
        ls -lh busybox
        arm-linux-gnueabihf-readelf -h busybox || true

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-gcc10
        path: busybox
        retention-days: 30
