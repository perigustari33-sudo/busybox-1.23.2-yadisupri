name: Build BusyBox Static for MDM9607 with Android NDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        # Download Android NDK r26b
        wget -c https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        
        # Set environment variables
        export NDK_PATH=$(pwd)/android-ndk-r26b
        export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        
        # Verifikasi compiler
        armv7a-linux-androideabi21-clang --version

    - name: Configure with all answers
      run: |
        # Gunakan yes untuk menjawab semua pertanyaan
        yes "" | make CC=armv7a-linux-androideabi21-clang \
                     CXX=armv7a-linux-androideabi21-clang++ \
                     AR=llvm-ar \
                     AS=llvm-as \
                     LD=ld.lld \
                     STRIP=llvm-strip \
                     CROSS_COMPILE=armv7a-linux-androideabi21- \
                     ARCH=arm \
                     defconfig
        
        # Set konfigurasi static dan LFS
        echo "CONFIG_STATIC=y" >> .config
        echo "CONFIG_LFS=y" >> .config
        echo "CONFIG_FEATURE_LFS=y" >> .config
        echo "CONFIG_CROSS_COMPILER_PREFIX=\"armv7a-linux-androideabi21-\"" >> .config
        echo "CONFIG_EXTRA_CFLAGS=\"-D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64\"" >> .config
        
        # Nonaktifkan interaktif dan update config
        yes "" | make CC=armv7a-linux-androideabi21-clang \
                     CXX=armv7a-linux-androideabi21-clang++ \
                     AR=llvm-ar \
                     AS=llvm-as \
                     LD=ld.lld \
                     STRIP=llvm-strip \
                     CROSS_COMPILE=armv7a-linux-androideabi21- \
                     ARCH=arm \
                     oldconfig

    - name: Build BusyBox
      run: |
        export CC=armv7a-linux-androideabi21-clang
        export CXX=armv7a-linux-androideabi21-clang++
        export AR=llvm-ar
        export AS=llvm-as
        export LD=ld.lld
        export STRIP=llvm-strip
        export CROSS_COMPILE=armv7a-linux-androideabi21-
        export ARCH=arm
        
        # Build
        make -j$(nproc) \
          CC="$CC" \
          CXX="$CXX" \
          AR="$AR" \
          AS="$AS" \
          LD="$LD" \
          STRIP="$STRIP" \
          CFLAGS="-Os -pipe -static -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=softfp -D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64" \
          LDFLAGS="-static" \
          SKIP_STRIP=n 2>&1 | tee build.log

    - name: Check build result
      run: |
        echo "=== Build Result ==="
        if [ -f busybox ]; then
          file busybox
          ls -lh busybox
          echo "Build successful!"
        else
          echo "Build failed!"
          echo ""
          echo "=== Last 50 lines of build.log ==="
          tail -50 build.log
          exit 1
        fi

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-mdm9607-ndk
        path: |
          busybox
          .config
          build.log
        retention-days: 30
