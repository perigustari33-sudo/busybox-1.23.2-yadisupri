name: Build BusyBox with GCC (Alpine)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Alpine Linux (musl libc)
      run: |
        docker run --rm -v $(pwd):/build alpine:3.17 /bin/sh -c "
          apk add --no-cache \
            gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            musl-dev-armhf \
            make bc bison flex cpio && \
          cd /build && \
          export CROSS_COMPILE=arm-linux-gnueabihf- && \
          export ARCH=arm && \
          cp configs/k02a.config .config && \
          echo 'CONFIG_STATIC=y' >> .config && \
          echo 'CONFIG_INETD=n' >> .config && \
          echo 'CONFIG_RDATE=n' >> .config && \
          echo 'CONFIG_RUNSV=n' >> .config && \
          echo 'CFLAGS += -Wno-error' >> .config && \
          make oldconfig && \
          make -j\$(nproc) CFLAGS='-Wno-error'
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
