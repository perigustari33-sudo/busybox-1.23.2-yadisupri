name: Build BusyBox with GCC (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Cross Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make bc bison flex cpio

    - name: Build BusyBox
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Copy config
        cp configs/k02a.config .config
        
        # Use sed to disable INETD completely
        sed -i 's/^CONFIG_INETD=y/# CONFIG_INETD is not set/' .config
        sed -i 's/^CONFIG_FEATURE_INETD_RPC=y/# CONFIG_FEATURE_INETD_RPC is not set/' .config
        sed -i 's/^CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_ECHO=y/# CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_ECHO is not set/' .config
        sed -i 's/^CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_DISCARD=y/# CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_DISCARD is not set/' .config
        sed -i 's/^CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_TIME=y/# CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_TIME is not set/' .config
        sed -i 's/^CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_DAYTIME=y/# CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_DAYTIME is not set/' .config
        sed -i 's/^CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_CHARGEN=y/# CONFIG_FEATURE_INETD_SUPPORT_BUILTIN_CHARGEN is not set/' .config
        
        # Add static and disable Werror
        echo "CONFIG_STATIC=y" >> .config
        echo "CFLAGS += -Wno-error -Wno-unused-result" >> .config
        
        make oldconfig
        make -j$(nproc) CFLAGS="-Wno-error -Wno-unused-result"

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
