name: Build BusyBox (Pre-built Toolchain)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pre-built musl toolchain
      run: |
        wget https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabihf-cross.tgz
        sudo tar -xzf arm-linux-musleabihf-cross.tgz -C /opt/
        export PATH=/opt/arm-linux-musleabihf-cross/bin:$PATH
        arm-linux-musleabihf-gcc --version

    - name: Build BusyBox
      run: |
        export PATH=/opt/arm-linux-musleabihf-cross/bin:$PATH
        export CROSS_COMPILE=arm-linux-musleabihf-
        export ARCH=arm
        
        make defconfig
        sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
        echo 'CONFIG_CROSS_COMPILER_PREFIX="/opt/arm-linux-musleabihf-cross/bin/arm-linux-musleabihf-"' >> .config
        yes "" | make oldconfig
        make clean
        make -j$(nproc)
        arm-linux-musleabihf-strip -s busybox
        file busybox

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: busybox-musl-static
        path: busybox
        retention-days: 30
