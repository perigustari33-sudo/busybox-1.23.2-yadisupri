name: Build BusyBox with GCC 10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC 10 Cross Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make bc bison flex cpio

    - name: Build BusyBox
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Copy your config
        cp configs/k02a.config .config
        echo "CONFIG_STATIC=y" >> .config
        
        # Disable -Werror
        echo "CFLAGS += -Wno-error" >> .config
        echo "CFLAGS += -Wno-unused-result" >> .config
        
        make oldconfig
        
        # Build with additional CFLAGS
        make -j$(nproc) CFLAGS="-Wno-error -Wno-unused-result"

    - name: Verify build
      run: |
        file busybox
        ls -lh busybox

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-gcc10
        path: busybox
        retention-days: 30
