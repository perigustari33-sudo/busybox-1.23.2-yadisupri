name: Build BusyBox Static for MDM9607 with Android NDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        # Download Android NDK r26b
        wget -c https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        
        # Set environment variables
        export NDK_PATH=$(pwd)/android-ndk-r26b
        export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        
        # Verifikasi compiler
        armv7a-linux-androideabi21-clang --version || true
        echo "NDK setup completed"

    - name: Configure for static build with Android NDK
      run: |
        # Gunakan compiler dari NDK
        export CC=armv7a-linux-androideabi21-clang
        export CXX=armv7a-linux-androideabi21-clang++
        export AR=llvm-ar
        export AS=llvm-as
        export LD=ld.lld
        export STRIP=llvm-strip
        
        # Buat konfigurasi minimal untuk MDM9607
        make defconfig
        
        # Konfigurasi static build
        echo "CONFIG_STATIC=y" >> .config
        echo "# CONFIG_FEATURE_SHARED_BUSYBOX is not set" >> .config
        echo "CONFIG_LFS=y" >> .config
        echo "CONFIG_FEATURE_LFS=y" >> .config
        
        # Nonaktifkan SHA HWACCEL
        sed -i 's/^CONFIG_SHA1_HWACCEL=y/# CONFIG_SHA1_HWACCEL is not set/' .config
        sed -i 's/^CONFIG_SHA256_HWACCEL=y/# CONFIG_SHA256_HWACCEL is not set/' .config
        
        # Set cross compiler prefix untuk NDK
        echo "CONFIG_CROSS_COMPILER_PREFIX=\"armv7a-linux-androideabi21-\"" >> .config
        
        make oldconfig

    - name: Build BusyBox with NDK
      run: |
        export CC=armv7a-linux-androideabi21-clang
        export CXX=armv7a-linux-androideabi21-clang++
        export AR=llvm-ar
        export AS=llvm-as
        export LD=ld.lld
        export STRIP=llvm-strip
        export CROSS_COMPILE=armv7a-linux-androideabi21-
        export ARCH=arm
        
        # Build dengan flags untuk Android
        make -j$(nproc) \
             CC="$CC" \
             CXX="$CXX" \
             AR="$AR" \
             AS="$AS" \
             LD="$LD" \
             STRIP="$STRIP" \
             CFLAGS="-Os -pipe -static -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=softfp -D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64" \
             LDFLAGS="-static" \
             SKIP_STRIP=n

    - name: Test binary with QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static
        qemu-arm-static ./busybox --version || true
        qemu-arm-static ./busybox echo "Test from Android NDK build"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-mdm9607-ndk
        path: |
          busybox
          busybox_unstripped
