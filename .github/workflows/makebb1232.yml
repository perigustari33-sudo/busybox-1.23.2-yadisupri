name: Build BusyBox Static for MDM9607 (Linaro GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Linaro GCC 4.9
      run: |
        # Gunakan link dari archive.linaro.org
        wget -c https://releases.linaro.org/archive/14.11/components/toolchain/binaries/arm-linux-gnueabihf/gcc-linaro-4.9-2014.11-x86_64_arm-linux-gnueabihf.tar.xz
        tar xf gcc-linaro-4.9-2014.11-x86_64_arm-linux-gnueabihf.tar.xz
        echo "$(pwd)/gcc-linaro-4.9-2014.11-x86_64_arm-linux-gnueabihf/bin" >> $GITHUB_PATH
        
        # Verifikasi
        arm-linux-gnueabihf-gcc --version

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make qemu-user-static

    - name: Configure and build
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        make defconfig
        echo "CONFIG_STATIC=y" >> .config
        echo "# CONFIG_FEATURE_SHARED_BUSYBOX is not set" >> .config
        sed -i 's/^CONFIG_SHA1_HWACCEL=y/# CONFIG_SHA1_HWACCEL is not set/' .config
        sed -i 's/^CONFIG_SHA256_HWACCEL=y/# CONFIG_SHA256_HWACCEL is not set/' .config
        make oldconfig
        
        make -j$(nproc) \
             CFLAGS="-Os -pipe -static -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard" \
             LDFLAGS="-static" \
             SKIP_STRIP=n

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-mdm9607-linaro49
        path: busybox
