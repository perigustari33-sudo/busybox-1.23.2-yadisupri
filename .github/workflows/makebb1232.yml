name: Build BusyBox with musl-cross-make

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with musl-cross-make
      run: |
        docker run --rm -v $(pwd):/build ubuntu:22.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y \
            build-essential \
            make \
            bc \
            bison \
            flex \
            cpio \
            file \
            git \
            wget \
            curl \
            texinfo \
            python3 \
            rsync && \
          
          echo '=== Building musl-cross-make ===' && \
          # Clone musl-cross-make
          git clone https://github.com/richfelker/musl-cross-make.git /tmp/musl-cross && \
          cd /tmp/musl-cross && \
          
          # Build cross compiler untuk ARM (butuh waktu ~5-10 menit)
          make TARGET=arm-linux-musleabihf install -j\$(nproc) && \
          
          # Tambahkan ke PATH
          export PATH=/tmp/musl-cross/output/bin:\$PATH && \
          
          # Verifikasi compiler
          echo '=== Verifikasi Cross Compiler ===' && \
          arm-linux-musleabihf-gcc --version && \
          
          cd /build && \
          export CROSS_COMPILE=arm-linux-musleabihf- && \
          export ARCH=arm && \
          export CC=arm-linux-musleabihf-gcc && \
          export LD=arm-linux-musleabihf-ld && \
          export AR=arm-linux-musleabihf-ar && \
          export STRIP=arm-linux-musleabihf-strip && \
          
          # Copy config dari configs/1232_config
          echo '=== Copying 1232_config ===' && \
          if [ -f configs/1232_config ]; then
            cp configs/1232_config .config
          else
            echo 'WARNING: configs/1232_config not found, using defconfig' && \
            make defconfig
          fi && \
          
          # Aktifkan static build
          echo '=== Enabling STATIC ===' && \
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config || \
          echo 'CONFIG_STATIC=y' >> .config && \
          
          # Aktifkan INIT
          echo '=== Enabling INIT ===' && \
          sed -i 's/^# CONFIG_INIT is not set/CONFIG_INIT=y/' .config || \
          echo 'CONFIG_INIT=y' >> .config && \
          
          sed -i 's/^# CONFIG_FEATURE_INITRD is not set/CONFIG_FEATURE_INITRD=y/' .config || \
          echo 'CONFIG_FEATURE_INITRD=y' >> .config && \
          
          # Aktifkan shell
          echo '=== Enabling SHELL ===' && \
          sed -i 's/^# CONFIG_ASH is not set/CONFIG_ASH=y/' .config || \
          echo 'CONFIG_ASH=y' >> .config && \
          
          sed -i 's/^# CONFIG_FEATURE_SH_IS_ASH is not set/CONFIG_FEATURE_SH_IS_ASH=y/' .config || \
          echo 'CONFIG_FEATURE_SH_IS_ASH=y' >> .config && \
          
          # Set cross compiler prefix di config
          echo '=== Setting CROSS_COMPILER_PREFIX ===' && \
          sed -i 's/^CONFIG_CROSS_COMPILER_PREFIX=.*/CONFIG_CROSS_COMPILER_PREFIX=\"arm-linux-musleabihf-\"/' .config || \
          echo 'CONFIG_CROSS_COMPILER_PREFIX=\"arm-linux-musleabihf-\"' >> .config && \
          
          # Tambahkan extra CFLAGS untuk menghindari error
          echo '=== Setting EXTRA_CFLAGS ===' && \
          echo 'CONFIG_EXTRA_CFLAGS=\"-Wno-error -static -no-pie\"' >> .config && \
          
          # Hapus konflik shell
          echo '=== Menghapus konfigurasi shell yang konflik ===' && \
          sed -i '/CONFIG_FEATURE_SH_IS_NONE/d' .config && \
          sed -i '/CONFIG_FEATURE_BASH_IS_NONE/d' .config && \
          sed -i '/CONFIG_FEATURE_SH_IS_HUSH/d' .config && \
          
          # Tampilkan config yang diaktifkan
          echo '=== Config yang diaktifkan ===' && \
          grep -E 'CONFIG_STATIC|CONFIG_INIT|CONFIG_ASH|CONFIG_FEATURE_SH_IS_ASH|CONFIG_CROSS_COMPILER_PREFIX' .config || echo 'Tidak ditemukan' && \
          
          # Update config - jawab default untuk semua pertanyaan
          echo '=== Running make oldconfig ===' && \
          yes "" | make oldconfig || true && \
          
          # Clean previous build jika ada
          echo '=== Cleaning previous build ===' && \
          make clean || true && \
          
          # Build
          echo '=== Building BusyBox ===' && \
          make -j\$(nproc) V=1 && \
          
          # Cek hasil build
          echo '=== Sebelum strip ===' && \
          ls -lh busybox || echo 'busybox not found!' && \
          
          # Strip binary
          if [ -f busybox ]; then
            echo '=== Stripping binary ===' && \
            arm-linux-musleabihf-strip -s -R .comment -R .note busybox && \
            echo '=== Sesudah strip ===' && \
            ls -lh busybox && \
            
            echo '=== Verifikasi file ===' && \
            file busybox && \
            
            echo '=== Mengecek relokasi (seharusnya kosong) ===' && \
            arm-linux-musleabihf-readelf -r busybox || echo '✓ No relocations found (seperti yang diharapkan!)' && \
            
            echo '=== Mengecek dynamic section (seharusnya tidak ada) ===' && \
            arm-linux-musleabihf-readelf -d busybox || echo '✓ No dynamic section (statically linked)' && \
            
            echo '=== Build SUCCESS ==='
          else
            echo '=== Build FAILED ===' && \
            echo 'Mencari file busybox...' && \
            find . -name 'busybox' -type f 2>/dev/null || echo 'Tidak ditemukan' && \
            echo '=== Log build terakhir ===' && \
            tail -100 build.log 2>/dev/null || echo 'No build.log' && \
            exit 1
          fi
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-musl-static
        path: busybox
        retention-days: 30
        
