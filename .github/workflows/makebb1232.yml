name: Build BusyBox with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Docker Ubuntu 18.04
      run: |
        docker run --rm -v $(pwd):/build ubuntu:18.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y \
            wget tar make bc bison flex cpio \
            libc6-dev libc6-dev-armhf-cross && \
          
          # Tampilkan semua versi yang tersedia
          echo '=== SEMUA VERSI GCC-ARM-LINUX-GNUEABIHF ===' && \
          apt-cache madison gcc-arm-linux-gnueabihf && \
          
          echo '=== SEMUA VERSI BINUTILS-ARM-LINUX-GNUEABIHF ===' && \
          apt-cache madison binutils-arm-linux-gnueabihf && \
          
          # Install versi spesifik 4.9.3 jika ada
          GCC_VERSION='' && \
          for ver in 4.9.3 4.9.2 4.9.1 4.9.0 4.8 4.7 4.6; do \
            if apt-cache show gcc-arm-linux-gnueabihf=\${ver}-* 2>/dev/null | grep -q '^Version:'; then \
              GCC_VERSION=\$ver && \
              echo \"Menemukan GCC versi \$ver\" && \
              break; \
            fi; \
          done && \
          
          if [ -n \"\$GCC_VERSION\" ]; then \
            echo \"=== Menginstall GCC versi \$GCC_VERSION ===\" && \
            apt-get install -y gcc-arm-linux-gnueabihf=\${GCC_VERSION}-* g++-arm-linux-gnueabihf=\${GCC_VERSION}-* binutils-arm-linux-gnueabihf=2.26-* 2>/dev/null || \
            apt-get install -y gcc-arm-linux-gnueabihf=\${GCC_VERSION}-* g++-arm-linux-gnueabihf=\${GCC_VERSION}-* binutils-arm-linux-gnueabihf=2.25-* 2>/dev/null || \
            apt-get install -y gcc-arm-linux-gnueabihf=\${GCC_VERSION}-* g++-arm-linux-gnueabihf=\${GCC_VERSION}-* binutils-arm-linux-gnueabihf; \
          else \
            echo \"=== GCC 4.9.x tidak ditemukan, install versi default ===\" && \
            apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf; \
          fi && \
          
          echo '=== Versi GCC yang terinstall ===' && \
          arm-linux-gnueabihf-gcc --version && \
          
          export CROSS_COMPILE=arm-linux-gnueabihf- && \
          export ARCH=arm && \
          
          cd /build && \
       
          echo 'CFLAGS += -Wno-error' >> .config && \
          
          make android_defconfig && \
          make -j\$(nproc) && \
          echo '=== Sebelum strip ===' && \
          ls -lh busybox && \
          arm-linux-gnueabihf-strip -s busybox && \
          echo '=== Sesudah strip ===' && \
          ls -lh busybox
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
