name: Build BusyBox with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Docker Ubuntu 18.04
      run: |
        docker run --rm -v $(pwd):/build ubuntu:18.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            make bc bison flex cpio \
            file && \
          
          cd /build && \
          export CROSS_COMPILE=arm-linux-gnueabihf- && \
          export ARCH=arm && \
          
          # Copy config dari configs/1232_config
          echo '=== Copying 1232_config ===' && \
          cp configs/1232_config .config && \
          
          # Aktifkan static build
          echo '=== Enabling STATIC ===' && \
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config || \
          echo 'CONFIG_STATIC=y' >> .config && \
          
          # Aktifkan INIT
          echo '=== Enabling INIT ===' && \
          sed -i 's/^# CONFIG_INIT is not set/CONFIG_INIT=y/' .config || \
          echo 'CONFIG_INIT=y' >> .config && \
          
          sed -i 's/^# CONFIG_FEATURE_INITRD is not set/CONFIG_FEATURE_INITRD=y/' .config || \
          echo 'CONFIG_FEATURE_INITRD=y' >> .config && \
          
          # Aktifkan shell
          echo '=== Enabling SHELL ===' && \
          sed -i 's/^# CONFIG_ASH is not set/CONFIG_ASH=y/' .config || \
          echo 'CONFIG_ASH=y' >> .config && \
          
          sed -i 's/^# CONFIG_FEATURE_SH_IS_ASH is not set/CONFIG_FEATURE_SH_IS_ASH=y/' .config || \
          echo 'CONFIG_FEATURE_SH_IS_ASH=y' >> .config && \
          
          # Set cross compiler
          echo '=== Setting CROSS_COMPILER ===' && \
          sed -i 's/^CONFIG_CROSS_COMPILER_PREFIX=.*/CONFIG_CROSS_COMPILER_PREFIX=\"arm-linux-gnueabihf-\"/' .config || \
          echo 'CONFIG_CROSS_COMPILER_PREFIX=\"arm-linux-gnueabihf-\"' >> .config && \
          
          # Tambahkan extra CFLAGS
          echo 'CONFIG_EXTRA_CFLAGS=\"-Wno-error\"' >> .config && \
          
          # Hapus konflik
          sed -i '/CONFIG_FEATURE_SH_IS_NONE/d' .config && \
          sed -i '/CONFIG_FEATURE_BASH_IS_NONE/d' .config && \
          
          # Tampilkan config yang diaktifkan
          echo '=== Config yang diaktifkan ===' && \
          grep -E 'CONFIG_STATIC|CONFIG_INIT|CONFIG_ASH|CONFIG_FEATURE_SH_IS_ASH' .config || echo 'Tidak ditemukan' && \
          
          # Update config
          echo '=== Running make oldconfig ===' && \
          make oldconfig && \
          
          # Build
          echo '=== Building BusyBox ===' && \
          make -j\$(nproc) && \
          
          echo '=== Sebelum strip ===' && \
          ls -lh busybox && \
          arm-linux-gnueabihf-strip -s busybox && \
          echo '=== Sesudah strip ===' && \
          ls -lh busybox && \
          
          # Verifikasi dengan file command (sudah terinstall)
          if [ -f busybox ]; then
            echo '=== Build SUCCESS ===' && \
            file busybox
          else
            echo '=== Build FAILED ===' && \
            echo 'Mencari file busybox...' && \
            find . -name 'busybox' -type f 2>/dev/null || echo 'Tidak ditemukan' && \
            exit 1
          fi
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
