name: Build BusyBox 1.23.2 with GCC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf make

    - name: Configure and build
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Defconfig dengan jawaban otomatis
        yes "" | make defconfig
        
        # Set static build
        echo "CONFIG_STATIC=y" >> .config
        sed -i 's/^CONFIG_DATE=y/# CONFIG_DATE is not set/' .config
        
        # Update config
        yes "" | make oldconfig
        
        # Build
        make -j$(nproc) \
          CFLAGS="-Os -pipe -static -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard" \
          LDFLAGS="-static"

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-1.23.2-arm
        path: busybox
        retention-days: 30
