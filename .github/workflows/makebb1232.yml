name: Build BusyBox with musl-cross-make

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with musl-cross-make
      run: |
        docker run --rm -v $(pwd):/build ubuntu:22.04 /bin/bash -c "
          set -e
          apt-get update && \
          apt-get install -y \
            build-essential \
            make \
            bc \
            bison \
            flex \
            cpio \
            file \
            git \
            wget \
            curl \
            texinfo \
            python3 \
            rsync \
            patch \
            xz-utils \
            unzip && \
          
          echo '=== Building musl-cross-make ===' && \
          cd /tmp && \
          git clone https://github.com/richfelker/musl-cross-make.git musl-cross && \
          cd musl-cross && \
          
          # Buat config.mak dengan target yang benar
          echo 'TARGET = arm-linux-musleabihf' > config.mak && \
          echo 'OUTPUT = /opt/musl-cross' >> config.mak && \
          
          # Build cross compiler
          make install -j\$(nproc) && \
          
          # Tambahkan ke PATH
          export PATH=/opt/musl-cross/bin:\$PATH && \
          
          # Verifikasi compiler
          echo '=== Verifikasi Cross Compiler ===' && \
          arm-linux-musleabihf-gcc --version && \
          which arm-linux-musleabihf-gcc || echo 'Not in PATH' && \
          
          cd /build && \
          export CROSS_COMPILE=arm-linux-musleabihf- && \
          export ARCH=arm && \
          export CC=arm-linux-musleabihf-gcc && \
          export LD=arm-linux-musleabihf-ld && \
          export AR=arm-linux-musleabihf-ar && \
          export STRIP=arm-linux-musleabihf-strip && \
          export PATH=/opt/musl-cross/bin:\$PATH && \
          
          # Buat config dari template
          echo '=== Membuat .config ===' && \
          if [ -f configs/1232_config ]; then
            cp configs/1232_config .config
          else
            echo 'WARNING: configs/1232_config not found, using defconfig' && \
            make defconfig
          fi && \
          
          # Modifikasi config
          echo '=== Modifikasi .config ===' && \
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config || echo 'CONFIG_STATIC=y' >> .config && \
          sed -i 's/^# CONFIG_INIT is not set/CONFIG_INIT=y/' .config || echo 'CONFIG_INIT=y' >> .config && \
          sed -i 's/^# CONFIG_FEATURE_INITRD is not set/CONFIG_FEATURE_INITRD=y/' .config || echo 'CONFIG_FEATURE_INITRD=y' >> .config && \
          sed -i 's/^# CONFIG_ASH is not set/CONFIG_ASH=y/' .config || echo 'CONFIG_ASH=y' >> .config && \
          sed -i 's/^# CONFIG_FEATURE_SH_IS_ASH is not set/CONFIG_FEATURE_SH_IS_ASH=y/' .config || echo 'CONFIG_FEATURE_SH_IS_ASH=y' >> .config && \
          sed -i '/CONFIG_FEATURE_SH_IS_NONE/d' .config && \
          sed -i '/CONFIG_FEATURE_BASH_IS_NONE/d' .config && \
          sed -i '/CONFIG_FEATURE_SH_IS_HUSH/d' .config && \
          
          # Hapus CROSS_COMPILER_PREFIX dari config agar tidak conflict dengan environment
          sed -i '/CONFIG_CROSS_COMPILER_PREFIX/d' .config && \
          
          # Tambahkan EXTRA_CFLAGS
          echo 'CONFIG_EXTRA_CFLAGS=\"-Wno-error -static -no-pie\"' >> .config && \
          
          echo '=== Konfigurasi yang diaktifkan ===' && \
          grep -E 'CONFIG_STATIC|CONFIG_INIT|CONFIG_ASH' .config || echo 'Tidak ditemukan' && \
          
          # Jalankan oldconfig (harus di direktori build busybox)
          echo '=== Running make oldconfig ===' && \
          yes \"\" | make oldconfig || echo 'oldconfig selesai' && \
          
          # Clean
          echo '=== Cleaning ===' && \
          make clean || true && \
          
          # Build
          echo '=== Building BusyBox ===' && \
          make -j\$(nproc) V=1 && \
          
          # Cek hasil
          echo '=== Hasil build ===' && \
          ls -lh busybox 2>/dev/null || echo 'busybox not found' && \
          
          if [ -f busybox ]; then
            echo '=== Stripping binary ===' && \
            arm-linux-musleabihf-strip -s -R .comment -R .note busybox && \
            echo '=== File info ===' && \
            file busybox && \
            echo '=== Mengecek relokasi ===' && \
            arm-linux-musleabihf-readelf -r busybox 2>&1 | head -20 || echo '✓ Tidak ada relokasi' && \
            echo '=== Mengecek dynamic section ===' && \
            arm-linux-musleabihf-readelf -d busybox 2>&1 | head -10 || echo '✓ Statically linked' && \
            echo '=== BUILD SUCCESS ==='
          else
            echo '=== BUILD FAILED ===' && \
            echo 'Mencari file...' && \
            find . -name 'busybox' -type f 2>/dev/null || echo 'Tidak ditemukan' && \
            echo '=== Directory contents ===' && \
            ls -la && \
            exit 1
          fi
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-musl-static
        path: busybox
        retention-days: 30
        
