name: Build BusyBox 1.23.2 for MDM9607 (Soft-Float)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabi \
          binutils-arm-linux-gnueabi \
          libc6-dev-armel-cross \
          make

    - name: Configure BusyBox
      run: |
        export CROSS_COMPILE=arm-linux-gnueabi-
        export ARCH=arm
        
        make defconfig
        echo "CONFIG_STATIC=y" >> .config
        echo "CONFIG_CROSS_COMPILER_PREFIX=\"arm-linux-gnueabi-\"" >> .config
        sed -i 's/^CONFIG_DATE=y/# CONFIG_DATE is not set/' .config
        make oldconfig

    - name: Build BusyBox
      run: |
        export CROSS_COMPILE=arm-linux-gnueabi-
        export ARCH=arm
        
        make -j$(nproc) \
          CFLAGS="-Os -pipe -static -march=armv7-a -mfloat-abi=soft" \
          LDFLAGS="-static" \
          SKIP_STRIP=n

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-1.23.2-arm-softfloat
        path: busybox
        retention-days: 30
