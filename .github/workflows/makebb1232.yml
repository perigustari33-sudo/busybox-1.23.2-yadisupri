name: Build BusyBox with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Docker Ubuntu 18.04
      run: |
        docker run --rm -v $(pwd):/build ubuntu:18.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y \
            wget tar make bc bison flex cpio \
            libc6-dev libc6-dev-armhf-cross && \
          
          # Cek semua versi gcc-arm-linux-gnueabihf yang tersedia
          echo '=== Mencari versi gcc-arm-linux-gnueabihf yang tersedia ===' && \
          apt-cache show gcc-arm-linux-gnueabihf | grep -E '^(Package|Version|Depends)' | head -20 && \
          
          # Coba install versi 4.9.3 jika ada
          echo '=== Mencoba install gcc-arm-linux-gnueabihf versi 4.9.3 ===' && \
          apt-get install -y gcc-arm-linux-gnueabihf=4.9.3-* g++-arm-linux-gnueabihf=4.9.3-* binutils-arm-linux-gnueabihf=2.26-* 2>/dev/null || \
          echo 'Versi 4.9.3 tidak ditemukan, mencoba versi default' && \
          apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf && \
          
          # Tampilkan versi yang terinstall
          echo '=== Versi GCC yang terinstall ===' && \
          arm-linux-gnueabihf-gcc --version && \
          
          export CROSS_COMPILE=arm-linux-gnueabihf- && \
          export ARCH=arm && \
          
          cd /build && \
          cp configs/custom_defconfig .config && \
          echo 'CONFIG_STATIC=y' >> .config && \
          echo 'CONFIG_INETD=n' >> .config && \
          echo 'CONFIG_RDATE=n' >> .config && \
          echo 'CONFIG_RUNSV=n' >> .config && \
          echo 'CFLAGS += -Wno-error' >> .config && \
          
          make oldconfig && \
          make -j\$(nproc) && \
          echo '=== Sebelum strip ===' && \
          ls -lh busybox && \
          arm-linux-gnueabihf-strip -s busybox && \
          echo '=== Sesudah strip ===' && \
          ls -lh busybox
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
