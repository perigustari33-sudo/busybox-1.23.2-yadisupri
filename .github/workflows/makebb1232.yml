name: Build BusyBox Static for MDM9607

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make qemu-user-static

    - name: Download ARM GNU Toolchain (arm-none-linux-gnueabihf)
      run: |
        # Menggunakan mirror resmi dari ARM Developer
        wget -c https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz
        echo "$(pwd)/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-linux-gnueabihf/bin" >> $GITHUB_PATH
        
        # Verifikasi
        arm-none-linux-gnueabihf-gcc --version

    - name: Configure and build
      run: |
        export CROSS_COMPILE=arm-none-linux-gnueabihf-
        export ARCH=arm
        
        make defconfig
        echo "CONFIG_STATIC=y" >> .config
        echo "# CONFIG_FEATURE_SHARED_BUSYBOX is not set" >> .config
        sed -i 's/^CONFIG_SHA1_HWACCEL=y/# CONFIG_SHA1_HWACCEL is not set/' .config
        sed -i 's/^CONFIG_SHA256_HWACCEL=y/# CONFIG_SHA256_HWACCEL is not set/' .config
        make oldconfig
        
        make -j$(nproc) \
             CFLAGS="-Os -pipe -static -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard" \
             LDFLAGS="-static" \
             SKIP_STRIP=n

    - name: Test binary with QEMU
      run: |
        qemu-arm-static ./busybox --version

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-mdm9607
        path: busybox
