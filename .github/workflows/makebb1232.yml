name: Build BusyBox with GCC 4.9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC 4.9 from PPA
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        
        # Install cross-compiler
        sudo apt-get install -y \
          gcc-4.9-arm-linux-gnueabihf \
          g++-4.9-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make \
          bc \
          bison \
          flex
        
        arm-linux-gnueabihf-gcc-4.9 --version

    - name: Build BusyBox
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Use your config
        cp configs/k02a.config .config
        echo "CONFIG_STATIC=y" >> .config
        
        make oldconfig
        make -j$(nproc) CC=arm-linux-gnueabihf-gcc-4.9
        
        file busybox

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-gcc49
        path: busybox
        retention-days: 30
