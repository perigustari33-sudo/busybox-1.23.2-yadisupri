name: Build BusyBox with GCC 4.9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Docker
      run: |
        # Create Dockerfile
        cat > Dockerfile << 'EOF'
        FROM ubuntu:18.04
        
        RUN apt-get update && apt-get install -y \
            gcc-4.9-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            make bc bison flex \
            && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /build
        COPY . .
        RUN cp configs/k02a.config .config && \
            echo "CONFIG_STATIC=y" >> .config && \
            make oldconfig && \
            make -j$(nproc) CC=arm-linux-gnueabihf-gcc-4.9
        EOF
        
        # Build with Docker
        docker build -t busybox-builder .
        
        # Extract the binary
        docker run --rm -v $(pwd):/output busybox-builder cp busybox /output/
        
        file busybox

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-gcc49
        path: busybox
        retention-days: 30
