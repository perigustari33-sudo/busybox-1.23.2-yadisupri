name: Build BusyBox with GCC 4.9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC 4.9
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-4.9-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make \
          bc \
          bison \
          flex
        
        # Verify GCC installation
        arm-linux-gnueabihf-gcc-4.9 --version

    - name: Build BusyBox with config
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Copy your specific config
        cp configs/k02a.config .config
        
        # Make sure static build is enabled
        echo "CONFIG_STATIC=y" >> .config
        
        # Build with GCC 4.9
        make oldconfig
        make -j$(nproc) CC=arm-linux-gnueabihf-gcc-4.9

    - name: Check build result
      run: |
        ls -lh busybox
        file busybox
        arm-linux-gnueabihf-readelf -h busybox || true

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-gcc49
        path: busybox
        retention-days: 30
