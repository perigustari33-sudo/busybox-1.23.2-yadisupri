name: Build BusyBox Static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install musl toolchain
      run: |
        wget https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabihf-cross.tgz
        sudo tar -xzf arm-linux-musleabihf-cross.tgz -C /opt/
        echo "PATH=/opt/arm-linux-musleabihf-cross/bin:$PATH" >> $GITHUB_ENV

    - name: Build BusyBox
      run: |
        export PATH=/opt/arm-linux-musleabihf-cross/bin:$PATH
        export CROSS_COMPILE=arm-linux-musleabihf-
        export ARCH=arm
        
        make defconfig
        
        # Disable problematic applets
        for applet in IFPLUGD INETD FEATURE_INETD_RPC \
                      RUNSV RUNSVDIR SV SVLOGD CHPST SETUIDGID ENVUIDGID ENVDIR SOFTLIMIT; do
          sed -i "s/CONFIG_${applet}=y/# CONFIG_${applet} is not set/" .config
        done
        
        # Enable static build
        sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
        sed -i 's/CONFIG_PIE=y/# CONFIG_PIE is not set/' .config
        
        # Set cross compiler prefix
        sed -i '/CONFIG_CROSS_COMPILER_PREFIX/d' .config
        echo 'CONFIG_CROSS_COMPILER_PREFIX="/opt/arm-linux-musleabihf-cross/bin/arm-linux-musleabihf-"' >> .config
        
        # Force static via EXTRA flags
        echo 'CONFIG_EXTRA_CFLAGS="-Wno-error -static"' >> .config
        echo 'CONFIG_EXTRA_LDFLAGS="-static"' >> .config
        
        yes "" | make oldconfig
        make clean
        make -j$(nproc)
        
        arm-linux-musleabihf-strip -s busybox
        
        echo "=== Verifikasi Binary ==="
        file busybox
        echo "=== Shared Library Dependencies ==="
        arm-linux-musleabihf-readelf -d busybox | grep NEEDED || echo "✓ Static (no dependencies)"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: busybox-static-arm
        path: busybox
        retention-days: 30
