name: Build BusyBox with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Docker Ubuntu 18.04
      run: |
        docker run --rm -v $(pwd):/build ubuntu:18.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            make bc bison flex cpio && \
          
          export CROSS_COMPILE=arm-linux-gnueabihf- && \
          export ARCH=arm && \
          
          cd /build && \
          
          # Tampilkan struktur direktori
          echo '=== Struktur direktori ===' && \
          ls -la && \
          
          # Buat .config
          cat > .config << 'EOF'
          CONFIG_HAVE_DOT_CONFIG=y
          CONFIG_DESKTOP=y
          CONFIG_PLATFORM_LINUX=y
          CONFIG_FEATURE_BUFFERS_USE_MALLOC=y
          CONFIG_BUSYBOX_EXEC_PATH=\"/proc/self/exe\"
          CONFIG_FEATURE_SYSLOG=y
          CONFIG_STATIC=y
          CONFIG_CROSS_COMPILER_PREFIX=\"arm-linux-gnueabihf-\"
          CONFIG_EXTRA_CFLAGS=\"-Wno-error\"
          CONFIG_NO_DEBUG_LIB=y
          CONFIG_INSTALL_APPLET_SYMLINKS=y
          CONFIG_PREFIX=\"./_install\"
          CONFIG_PASSWORD_MINLEN=6
          CONFIG_MD5_SMALL=1
          CONFIG_FEATURE_USE_TERMIOS=y
          CONFIG_FEATURE_COPYBUF_KB=4
          CONFIG_ASH=y
          CONFIG_CTTYHACK=y
          CONFIG_HUSH=y
          CONFIG_FEATURE_SH_IS_ASH=y
          CONFIG_FEATURE_BASH_IS_ASH=y
          CONFIG_INIT=y
          CONFIG_FEATURE_USE_INITTAB=y
          CONFIG_FEATURE_INIT_SCTTY=y
          CONFIG_FEATURE_INIT_SYSLOG=y
          CONFIG_FEATURE_INITRD=y
          CONFIG_HALT=y
          CONFIG_SWITCH_ROOT=y
          CONFIG_MOUNT=y
          CONFIG_FEATURE_MOUNT_FAKE=y
          CONFIG_FEATURE_MOUNT_VERBOSE=y
          CONFIG_FEATURE_MOUNT_LABEL=y
          CONFIG_FEATURE_MOUNT_FLAGS=y
          CONFIG_FEATURE_MOUNT_FSTAB=y
          CONFIG_UMOUNT=y
          CONFIG_FEATURE_UMOUNT_ALL=y
          CONFIG_FEATURE_MOUNT_LOOP=y
          CONFIG_FEATURE_MOUNT_LOOP_CREATE=y
          CONFIG_CAT=y
          CONFIG_ECHO=y
          CONFIG_FEATURE_FANCY_ECHO=y
          CONFIG_LS=y
          CONFIG_FEATURE_LS_FILETYPES=y
          CONFIG_FEATURE_LS_RECURSIVE=y
          CONFIG_FEATURE_LS_SORTFILES=y
          CONFIG_FEATURE_LS_TIMESTAMPS=y
          CONFIG_FEATURE_LS_USERNAME=y
          CONFIG_MKDIR=y
          CONFIG_MV=y
          CONFIG_PWD=y
          CONFIG_RM=y
          CONFIG_RMDIR=y
          CONFIG_CP=y
          CONFIG_SLEEP=y
          CONFIG_SYNC=y
          CONFIG_TRUE=y
          CONFIG_FALSE=y
          CONFIG_UNAME=y
          CONFIG_WHOAMI=y
          CONFIG_YES=y
          CONFIG_HOSTNAME=y
          CONFIG_DMESG=y
          CONFIG_FEATURE_DMESG_PRETTY=y
          CONFIG_PS=y
          CONFIG_FEATURE_PS_TIME=y
          CONFIG_FEATURE_PS_ADDITIONAL_COLUMNS=y
          CONFIG_KILL=y
          CONFIG_KILLALL=y
          CONFIG_PIDOF=y
          CONFIG_FREE=y
          CONFIG_UPTIME=y
          CONFIG_VI=y
          CONFIG_FEATURE_VI_MAX_LEN=4096
          CONFIG_FEATURE_VI_COLON=y
          CONFIG_FEATURE_VI_YANKMARK=y
          CONFIG_FEATURE_VI_SEARCH=y
          CONFIG_FEATURE_VI_USE_SIGNALS=y
          CONFIG_FEATURE_VI_DOT_CMD=y
          CONFIG_FEATURE_VI_READONLY=y
          CONFIG_FEATURE_VI_SETOPTS=y
          CONFIG_FEATURE_VI_SET=y
          CONFIG_SED=y
          CONFIG_GREP=y
          CONFIG_FEATURE_GREP_EGREP_ALIAS=y
          CONFIG_FEATURE_GREP_FGREP_ALIAS=y
          CONFIG_FIND=y
          CONFIG_FEATURE_FIND_PRINT0=y
          CONFIG_FEATURE_FIND_MTIME=y
          CONFIG_FEATURE_FIND_MMIN=y
          CONFIG_FEATURE_FIND_PERM=y
          CONFIG_FEATURE_FIND_TYPE=y
          CONFIG_FEATURE_FIND_XDEV=y
          CONFIG_FEATURE_FIND_MAXDEPTH=y
          CONFIG_FEATURE_FIND_EXEC=y
          CONFIG_FEATURE_FIND_USER=y
          CONFIG_FEATURE_FIND_GROUP=y
          CONFIG_FEATURE_FIND_NOT=y
          CONFIG_FEATURE_FIND_DEPTH=y
          CONFIG_FEATURE_FIND_SIZE=y
          CONFIG_TAR=y
          CONFIG_FEATURE_TAR_CREATE=y
          CONFIG_FEATURE_TAR_AUTODETECT=y
          CONFIG_FEATURE_TAR_FROM=y
          CONFIG_FEATURE_TAR_GNU_EXTENSIONS=y
          CONFIG_GUNZIP=y
          CONFIG_GZIP=y
          CONFIG_UNZIP=y
          CONFIG_IFCONFIG=y
          CONFIG_FEATURE_IFCONFIG_STATUS=y
          CONFIG_FEATURE_IFCONFIG_HW=y
          CONFIG_PING=y
          CONFIG_FEATURE_FANCY_PING=y
          CONFIG_FEATURE_PRESERVE_HARDLINKS=y
          CONFIG_FEATURE_AUTOWIDTH=y
          CONFIG_FEATURE_HUMAN_READABLE=y
          EOF
          
          # Tampilkan isi .config
          echo '=== Isi .config ===' && \
          cat .config && \
          
          # Build
          echo '=== Running make oldconfig ===' && \
          make oldconfig && \
          
          echo '=== Running make ===' && \
          make -j\$(nproc) && \
          
          # Cek hasil build
          echo '=== Hasil build ===' && \
          ls -la && \
          
          if [ -f busybox ]; then
            echo '=== Sebelum strip ===' && \
            ls -lh busybox && \
            file busybox && \
            arm-linux-gnueabihf-strip -s busybox && \
            echo '=== Sesudah strip ===' && \
            ls -lh busybox && \
            file busybox
          else
            echo '=== ERROR: busybox tidak ditemukan! ===' && \
            echo 'Mencoba mencari file busybox di seluruh direktori...' && \
            find . -name 'busybox' -type f 2>/dev/null || echo 'Tidak ditemukan' && \
            exit 1
          fi
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
