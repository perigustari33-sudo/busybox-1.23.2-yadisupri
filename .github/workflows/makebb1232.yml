name: Build BusyBox with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Docker Ubuntu 18.04
      run: |
        docker run --rm -v $(pwd):/build ubuntu:18.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            make bc bison flex cpio && \
          cd /build && \
          export CROSS_COMPILE=arm-linux-gnueabihf- && \
          export ARCH=arm && \
          cp configs/custom_defconfig .config && \
          echo 'CONFIG_STATIC=y' >> .config && \
          echo 'CONFIG_INETD=n' >> .config && \
          echo 'CONFIG_RDATE=n' >> .config && \
          echo 'CONFIG_RUNSV=n' >> .config && \
          echo 'CFLAGS += -Wno-error' >> .config && \
          make oldconfig && \
          make -j\$(nproc) && \
          echo '=== Sebelum strip ===' && \
          ls -lh busybox && \
          arm-linux-gnueabihf-strip -s busybox && \
          echo '=== Sesudah strip ===' && \
          ls -lh busybox
        "

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox
        path: busybox
        retention-days: 30
