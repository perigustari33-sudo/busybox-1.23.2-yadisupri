name: Build BusyBox (Pre-built Toolchain - Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pre-built musl toolchain
      run: |
        wget https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabihf-cross.tgz
        sudo tar -xzf arm-linux-musleabihf-cross.tgz -C /opt/
        export PATH=/opt/arm-linux-musleabihf-cross/bin:$PATH
        arm-linux-musleabihf-gcc --version

    - name: Build BusyBox
      run: |
        export PATH=/opt/arm-linux-musleabihf-cross/bin:$PATH
        export CROSS_COMPILE=arm-linux-musleabihf-
        export ARCH=arm
        
        # Generate default config
        make defconfig
        
        # Disable problematic applets (header conflicts)
        echo "Disabling IFPLUGD..."
        sed -i 's/CONFIG_IFPLUGD=y/# CONFIG_IFPLUGD is not set/' .config
        
        echo "Disabling INETD (needs RPC headers)..."
        sed -i 's/CONFIG_INETD=y/# CONFIG_INETD is not set/' .config
        sed -i 's/CONFIG_FEATURE_INETD_RPC=y/# CONFIG_FEATURE_INETD_RPC is not set/' .config
        
        # Enable static build
        echo "Enabling static build..."
        sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
        
        # Set cross compiler prefix
        echo "Setting cross compiler prefix..."
        sed -i '/CONFIG_CROSS_COMPILER_PREFIX/d' .config
        echo 'CONFIG_CROSS_COMPILER_PREFIX="/opt/arm-linux-musleabihf-cross/bin/arm-linux-musleabihf-"' >> .config
        
        # Add extra CFLAGS
        sed -i '/CONFIG_EXTRA_CFLAGS/d' .config
        echo 'CONFIG_EXTRA_CFLAGS="-Wno-error -static"' >> .config
        
        # Run oldconfig
        echo "Running oldconfig..."
        yes "" | make oldconfig
        
        # Clean and build
        echo "Building BusyBox..."
        make clean
        make -j$(nproc)
        
        # Strip and verify
        echo "Stripping binary..."
        arm-linux-musleabihf-strip -s -R .comment -R .note busybox
        echo "File info:"
        file busybox
        echo "=== BUILD SUCCESS ==="

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: busybox-musl-static
        path: busybox
        retention-days: 30
