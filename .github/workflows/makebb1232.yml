name: Build BusyBox with GCC 10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC 10
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-10-arm-linux-gnueabihf \
          g++-10-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make bc bison flex cpio
        
        # Create symlink so arm-linux-gnueabihf-gcc points to gcc-10
        sudo ln -sf /usr/bin/arm-linux-gnueabihf-gcc-10 /usr/bin/arm-linux-gnueabihf-gcc
        sudo ln -sf /usr/bin/arm-linux-gnueabihf-g++-10 /usr/bin/arm-linux-gnueabihf-g++
        
        # Verify
        arm-linux-gnueabihf-gcc --version

    - name: Build BusyBox
      run: |
        export CROSS_COMPILE=arm-linux-gnueabihf-
        export ARCH=arm
        
        # Use your config
        cp configs/k02a.config .config
        echo "CONFIG_STATIC=y" >> .config
        
        make oldconfig
        make -j$(nproc)

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: busybox-gcc10
        path: busybox
        retention-days: 30
