name: Build BusyBox Static ARM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          make \
          wget \
          bc \
          git \
          cpio \
          rsync \
          qemu-user-static
        
        # Verify cross compiler
        arm-linux-gnueabihf-gcc --version

    - name: Configure for static build
      run: |
        # Create default config
        make ARCH=arm \
             CROSS_COMPILE=arm-linux-gnueabihf- \
             defconfig
        
        # Enable static build
        echo "CONFIG_STATIC=y" >> .config
        
        # Disable shared libraries
        echo "CONFIG_FEATURE_PREFER_APPLETS=y" >> .config
        echo "# CONFIG_FEATURE_SHARED_BUSYBOX is not set" >> .config
        
        # Remove any existing march flags from config
        sed -i '/CONFIG_EXTRA_CFLAGS/d' .config
        
        # Apply config
        make ARCH=arm \
             CROSS_COMPILE=arm-linux-gnueabihf- \
             oldconfig

    - name: Build BusyBox
      run: |
        # Build dengan CFLAGS yang benar
        make -j$(nproc) \
             ARCH=arm \
             CROSS_COMPILE=arm-linux-gnueabihf- \
             CFLAGS="-Os -pipe -static" \
             LDFLAGS="-static" \
             SKIP_STRIP=n \
             EXTRA_CFLAGS="-march=armv7-a"
        
        # Check hasil build
        file busybox
        ls -lh busybox

    - name: Test binary with QEMU
      run: |
        # Test help
        qemu-arm-static ./busybox --help || true
        
        # Test version
        qemu-arm-static ./busybox --version
        
        # Test basic commands
        qemu-arm-static ./busybox echo "Hello from BusyBox!"
        qemu-arm-static ./busybox ls -la

    - name: Show binary info
      run: |
        echo "=== Binary Information ==="
        file busybox
        echo ""
        echo "=== Size ==="
        ls -lh busybox
        echo ""
        echo "=== Static Check ==="
        arm-linux-gnueabihf-readelf -d busybox | grep NEEDED || echo "No dynamic dependencies (static binary)"
        echo ""
        echo "=== Architecture ==="
        arm-linux-gnueabihf-readelf -h busybox | grep Machine

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-static-armv7l
        path: |
          busybox
          busybox_unstripped
          .config
        retention-days: 30

    - name: Create compressed binary
      run: |
        # Compress binary for smaller artifact
        gzip -9 -c busybox > busybox-armv7l.gz
        
        # Create checksum
        sha256sum busybox > busybox-armv7l.sha256
        
        # Create info file
        cat > busybox-info.txt << EOF
        BusyBox ARM Static Build
        =========================
        Build Date: $(date)
        Version: $(./busybox --version | head -1)
        Architecture: ARM 32-bit (armv7-a)
        Static: Yes
        Size: $(ls -lh busybox | awk '{print $5}')
        SHA256: $(sha256sum busybox | awk '{print $1}')
        EOF

    - name: Upload compressed artifacts
      uses: actions/upload-artifact@v4
      with:
        name: busybox-armv7l-compressed
        path: |
          busybox-armv7l.gz
          busybox-armv7l.sha256
          busybox-info.txt
        retention-days: 30

    - name: Create release package
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        mkdir -p release/
        cp busybox release/busybox-armv7l
        cp .config release/config-armv7l.txt
        cp busybox-info.txt release/
        
        # Create tarball
        tar -czf busybox-armv7l-static.tar.gz -C release/ .
        
        # Create checksum
        sha256sum busybox-armv7l-static.tar.gz > busybox-armv7l-static.tar.gz.sha256

    - name: Upload release assets
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: actions/upload-artifact@v4
      with:
        name: release-armv7l
        path: |
          busybox-armv7l-static.tar.gz
          busybox-armv7l-static.tar.gz.sha256
        retention-days: 90
